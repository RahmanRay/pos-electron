# electron-builder configuration — Windows (NSIS), macOS (DMG), Linux (AppImage).
# The product name and version come from package.json ("productName", "version").
# The icon is build/icon.png.
appId: com.restaurantcamera.demo
copyright: Copyright © 2026 Restoran Kamera

directories:
  output: release/${version}
  buildResources: build

# Only the compiled application is packaged (no runtime dependencies).
# dist/ includes the local detection model when `npm run setup-model` was run before the build.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  deleteAppDataOnUninstall: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.utilities
  hardenedRuntime: true
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Utility
  synopsis: Local RTSP restaurant table-occupancy monitor
  artifactName: ${productName}-${version}.${ext}
